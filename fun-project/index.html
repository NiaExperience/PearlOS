<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pearl Nebula</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a12;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;font-family:system-ui,sans-serif}
  canvas{display:block;cursor:crosshair;border-radius:12px;box-shadow:0 0 80px rgba(120,80,200,.15)}
  #info{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.25);font-size:13px;letter-spacing:2px;text-transform:uppercase;pointer-events:none;transition:opacity .8s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">move your cursor &bull; click for burst</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,particles=[],mouse={x:-9999,y:-9999},t=0,burst=0;

function resize(){
  W=canvas.width=Math.min(window.innerWidth-40,800);
  H=canvas.height=Math.min(window.innerHeight-40,700);
}
resize(); window.addEventListener('resize',resize);

const COLORS=[
  [180,120,255],[255,150,200],[120,220,255],
  [255,200,100],[200,140,255],[100,240,200],
  [255,160,140],[160,200,255]
];

class Pearl{
  constructor(){this.reset();this.x=Math.random()*W;this.y=Math.random()*H}
  reset(){
    this.x=Math.random()*W;this.y=Math.random()*H;
    this.vx=(Math.random()-.5)*.6;this.vy=(Math.random()-.5)*.6;
    this.r=2+Math.random()*4;this.baseR=this.r;
    this.c=COLORS[Math.floor(Math.random()*COLORS.length)];
    this.phase=Math.random()*Math.PI*2;this.hueOff=Math.random()*360;
    this.life=1;this.trail=[];
  }
  update(){
    this.phase+=.02;this.hueOff+=.3;
    // mouse interaction
    let dx=this.x-mouse.x,dy=this.y-mouse.y;
    let dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<200){
      let force=(200-dist)/200;
      if(mouse.down){force*=-1.5;this.r=this.baseR*(1+force/2)}
      this.vx+=dx/dist*force*.06;this.vy+=dy/dist*force*.06;
    }
    // ambient drift
    this.vx+=Math.sin(this.phase)*.004;this.vy+=Math.cos(this.phase*.7)*.004;
    this.vx*=.98;this.vy*=.98;
    this.x+=this.vx;this.y+=this.vy;
    // wrap
    if(this.x<-20)this.x=W+20;if(this.x>W+20)this.x=-20;
    if(this.y<-20)this.y=H+20;if(this.y>H+20)this.y=-20;
    // trail
    if(burst>0)this.trail.push({x:this.x,y:this.y,a:1});
    for(let i=this.trail.length-1;i>=0;i--){
      this.trail[i].a*=.94;this.trail[i].x+=this.vx*.3;this.trail[i].y+=this.vy*.3;
      if(this.trail[i].a<.01)this.trail.splice(i,1);
    }
  }
  draw(){
    let gl=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r*4);
    let h=((this.hueOff%360)/360)*.3+((this.phase+Date.now()/5000)%(Math.PI*2))/(Math.PI*2)*.7;
    let [r,g,b]=this.c;
    let pulse=.7+Math.sin(t+this.phase)*.3;
    gl.addColorStop(0,`rgba(${r},${g},${b},${pulse*this.life})`);
    gl.addColorStop(.3,`rgba(${r},${g},${b},${pulse*this.life*.4})`);
    gl.addColorStop(1,`rgba(${r},${g},${b},0)`);
    ctx.fillStyle=gl;ctx.beginPath();ctx.arc(this.x,this.y,this.r*4,0,Math.PI*2);ctx.fill();
    // core
    ctx.fillStyle=`rgba(255,255,255,${.4*this.life})`;
    ctx.beginPath();ctx.arc(this.x,this.y,this.r*.6,0,Math.PI*2);ctx.fill();
    // trails
    for(let t of this.trail){
      ctx.fillStyle=`rgba(${r},${g},${b},${t.a*.3})`;
      ctx.beginPath();ctx.arc(t.x,t.y,this.r*t.a,0,Math.PI*2);ctx.fill();
    }
  }
}

function init(){particles=[];for(let i=0;i<120;i++)particles.push(new Pearl())}
init();

canvas.addEventListener('mousemove',e=>{
  let r=canvas.getBoundingClientRect();
  mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;
});
canvas.addEventListener('mouseleave',()=>{mouse.x=-9999;mouse.y=-9999;mouse.down=false});
canvas.addEventListener('mousedown',()=>{
  mouse.down=true;
  burst=1;
  for(let p of particles){
    let dx=p.x-mouse.x,dy=p.y-mouse.y;
    let dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<150){p.vx+=dx/dist*8;p.vy+=dy/dist*8;p.trail=[]}
  }
  setTimeout(()=>mouse.down=false,120);
});
window.addEventListener('touchstart',e=>{
  let r=canvas.getBoundingClientRect(),t=e.touches[0];
  mouse.x=t.clientX-r.left;mouse.y=t.clientY-r.top;
  mouse.down=true;burst=1;
  for(let p of particles){
    let dx=p.x-mouse.x,dy=p.y-mouse.y;
    let dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<200){p.vx+=dx/dist*8;p.vy+=dy/dist*8;p.trail=[]}
  }
  setTimeout(()=>mouse.down=false,120);
});
window.addEventListener('touchmove',e=>{
  let r=canvas.getBoundingClientRect(),t=e.touches[0];
  mouse.x=t.clientX-r.left;mouse.y=t.clientY-r.top;e.preventDefault();
},{passive:false});
window.addEventListener('touchend',()=>{mouse.x=-9999;mouse.y=-9999});

// background stars
function drawStars(){
  if(!drawStars.cache){
    let d=document.createElement('canvas');d.width=W;d.height=H;
    let c=d.getContext('2d');
    for(let i=0;i<120;i++){
      let x=Math.random()*W,y=Math.random()*H,s=.3+Math.random()*1.2;
      c.fillStyle=`rgba(255,255,255,${.15+Math.random()*.3})`;
      c.beginPath();c.arc(x,y,s,0,Math.PI*2);c.fill();
    }
    drawStars.cache=d;
  }
  ctx.drawImage(drawStars.cache,0,0);
}

function loop(){
  t+=.02;
  ctx.fillStyle='rgba(10,10,18,.3)';ctx.fillRect(0,0,W,H);
  drawStars();
  for(let p of particles)p.update();
  for(let p of particles)p.draw();
  burst*=.96;if(burst<.01)burst=0;
  requestAnimationFrame(loop);
}
loop();

// click anywhere to respawn
canvas.addEventListener('dblclick',()=>{init();mouse.down=true});
</script>
</body>
</html>
