      - name: Build Interface Docker image
        run: |
          docker build -f apps/interface/Dockerfile -t nia-interface:ci --build-arg WEB_BASE_IMAGE=nia-web-base:ci .
          echo "✅ Interface Docker image built successfully"

      - name: Aggressive disk reclaim before Trivy (interface)
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/dotnet || true
          df -h

      - name: Prepare Trivy scratch space (interface)
        run: |
          export TRIVY_TEMP_DIR="${{ runner.temp }}/trivy-interface-tmp"
          export TRIVY_CACHE_DIR="${{ runner.temp }}/trivy-interface-cache"
          mkdir -p "$TRIVY_TEMP_DIR" "$TRIVY_CACHE_DIR"
          echo "TRIVY_TEMP_DIR=$TRIVY_TEMP_DIR" >> "$GITHUB_ENV"
          echo "TRIVY_CACHE_DIR=$TRIVY_CACHE_DIR" >> "$GITHUB_ENV"

      - name: Scan interface image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        env:
          TRIVY_TEMP_DIR: ${{ runner.temp }}/trivy-interface-tmp
          TMPDIR: ${{ runner.temp }}/trivy-interface-tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/trivy-interface-cache
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-interface-cache
        with:
          image-ref: nia-interface:ci
          severity: CRITICAL,HIGH
          vuln-type: os,library
          cache: true
          exit-code: '0'
          timeout: 10m
          scanners: vuln
          cache-dir: ${{ env.TRIVY_CACHE_DIR }}
          format: json
          output: trivy-interface.json

      - name: Clear Trivy cache to free space (interface)
        run: |
          rm -rf ${{ runner.temp }}/trivy-interface-cache || true
          df -h

      - name: Upload Trivy report (interface)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-interface
          path: trivy-interface.json

  scan-mesh:
    if: "${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free disk space before build
        run: |
          docker system prune -af --volumes || true
          sudo rm -rf /var/lib/docker/tmp/* || true
          df -h

      - name: Build Mesh Docker image
        run: |
          docker build -f apps/mesh/Dockerfile -t nia-mesh:ci .
          echo "✅ Mesh Docker image built successfully"

      - name: Aggressive disk reclaim before Trivy (mesh)
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/dotnet || true
          df -h

      - name: Prepare Trivy scratch space (mesh)
        run: |
          export TRIVY_TEMP_DIR="${{ runner.temp }}/trivy-mesh-tmp"
          export TRIVY_CACHE_DIR="${{ runner.temp }}/trivy-mesh-cache"
          mkdir -p "$TRIVY_TEMP_DIR" "$TRIVY_CACHE_DIR"
          echo "TRIVY_TEMP_DIR=$TRIVY_TEMP_DIR" >> "$GITHUB_ENV"
          echo "TRIVY_CACHE_DIR=$TRIVY_CACHE_DIR" >> "$GITHUB_ENV"

      - name: Scan mesh image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        env:
          TRIVY_TEMP_DIR: ${{ runner.temp }}/trivy-mesh-tmp
          TMPDIR: ${{ runner.temp }}/trivy-mesh-tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/trivy-mesh-cache
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-mesh-cache
        with:
          image-ref: nia-mesh:ci
          severity: CRITICAL,HIGH
          vuln-type: os,library
          cache: true
          exit-code: '0'
          timeout: 10m
          scanners: vuln
          cache-dir: ${{ env.TRIVY_CACHE_DIR }}
          format: json
          output: trivy-mesh.json

      - name: Clear Trivy cache to free space (mesh)
        run: |
          rm -rf ${{ runner.temp }}/trivy-mesh-cache || true
          df -h

      - name: Upload Trivy report (mesh)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-mesh
          path: trivy-mesh.json

  scan-pipecat:
    if: "${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Pipecat Daily Bot image (server mode)
        run: |
          docker build -f apps/pipecat-daily-bot/Dockerfile -t pipecat-daily-bot:ci-server --build-arg MODE=server .
          echo "✅ Pipecat Daily Bot (server) image built successfully"

      - name: Aggressive disk reclaim before Trivy (pipecat)
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/dotnet || true
          df -h

      - name: Prepare Trivy scratch space (pipecat)
        run: |
          export TRIVY_TEMP_DIR="${{ runner.temp }}/trivy-pipecat-tmp"
          export TRIVY_CACHE_DIR="${{ runner.temp }}/trivy-pipecat-cache"
          mkdir -p "$TRIVY_TEMP_DIR" "$TRIVY_CACHE_DIR"
          echo "TRIVY_TEMP_DIR=$TRIVY_TEMP_DIR" >> "$GITHUB_ENV"
          echo "TRIVY_CACHE_DIR=$TRIVY_CACHE_DIR" >> "$GITHUB_ENV"

      - name: Scan pipecat image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        env:
          TRIVY_TEMP_DIR: ${{ runner.temp }}/trivy-pipecat-tmp
          TMPDIR: ${{ runner.temp }}/trivy-pipecat-tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/trivy-pipecat-cache
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-pipecat-cache
        with:
          image-ref: pipecat-daily-bot:ci-server
          severity: CRITICAL,HIGH
          vuln-type: os,library
          cache: true
          exit-code: '0'
