name: daily-image-scan

on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches:
      - fix-cron-scan
  workflow_dispatch:
    inputs:
      mode:
        description: Run full builds or a sample-only dry run
        type: choice
        options:
          - full
          - sample
        default: full

permissions:
  contents: read

jobs:
  scan-dashboard:
    if: "${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free disk space before build
        run: |
          docker system prune -af --volumes || true
          sudo rm -rf /var/lib/docker/tmp/* || true
          df -h

      - name: Build shared web base (local)
        run: |
          docker build -f apps/web-base/Dockerfile -t nia-web-base:ci .
          echo "✅ Web base image built (local tag: nia-web-base:ci)"

      - name: Build Dashboard Docker image
        run: |
          docker build -f apps/dashboard/Dockerfile -t nia-dashboard:ci --build-arg WEB_BASE_IMAGE=nia-web-base:ci .
          echo "✅ Dashboard Docker image built successfully"

      - name: Aggressive disk reclaim before Trivy (dashboard)
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/dotnet || true
          df -h

      - name: Prepare Trivy scratch space (dashboard)
        run: |
          export TRIVY_TEMP_DIR="${{ runner.temp }}/trivy-dashboard-tmp"
          export TRIVY_CACHE_DIR="${{ runner.temp }}/trivy-dashboard-cache"
          mkdir -p "$TRIVY_TEMP_DIR" "$TRIVY_CACHE_DIR"
          echo "TRIVY_TEMP_DIR=$TRIVY_TEMP_DIR" >> "$GITHUB_ENV"
          echo "TRIVY_CACHE_DIR=$TRIVY_CACHE_DIR" >> "$GITHUB_ENV"

      - name: Scan dashboard image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        env:
          TRIVY_TEMP_DIR: ${{ runner.temp }}/trivy-dashboard-tmp
          TMPDIR: ${{ runner.temp }}/trivy-dashboard-tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/trivy-dashboard-cache
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-dashboard-cache
        with:
          image-ref: nia-dashboard:ci
          severity: CRITICAL,HIGH
          vuln-type: os,library
          cache: true
          exit-code: '0'
          timeout: 10m
          scanners: vuln
          cache-dir: ${{ env.TRIVY_CACHE_DIR }}
          format: json
          output: trivy-dashboard.json

      - name: Clear Trivy cache to free space (dashboard)
        run: |
          rm -rf ${{ runner.temp }}/trivy-dashboard-cache || true
          df -h

      - name: Upload Trivy report (dashboard)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-dashboard
          path: trivy-dashboard.json

  scan-interface:
    if: "${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free disk space before build
        run: |
          docker system prune -af --volumes || true
          sudo rm -rf /var/lib/docker/tmp/* || true
          df -h

      - name: Build shared web base (local)
        run: |
          docker build -f apps/web-base/Dockerfile -t nia-web-base:ci .
