      - name: Upload Trivy report (pipecat)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-pipecat
          path: trivy-pipecat.json

  scan-kokoro:
    if: "${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.NIAXP_PAT }}
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Kokoro TTS image
        run: |
          docker build -f apps/chorus-tts/Dockerfile -t kokoro-tts:ci apps/chorus-tts
          echo "✅ Kokoro TTS image built successfully"

      - name: Aggressive disk reclaim before Trivy (kokoro)
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/dotnet || true
          df -h

      - name: Prepare Trivy scratch space (kokoro)
        run: |
          export TRIVY_TEMP_DIR="${{ runner.temp }}/trivy-kokoro-tmp"
          export TRIVY_CACHE_DIR="${{ runner.temp }}/trivy-kokoro-cache"
          mkdir -p "$TRIVY_TEMP_DIR" "$TRIVY_CACHE_DIR"
          echo "TRIVY_TEMP_DIR=$TRIVY_TEMP_DIR" >> "$GITHUB_ENV"
          echo "TRIVY_CACHE_DIR=$TRIVY_CACHE_DIR" >> "$GITHUB_ENV"

      - name: Scan kokoro image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        env:
          TRIVY_TEMP_DIR: ${{ runner.temp }}/trivy-kokoro-tmp
          TMPDIR: ${{ runner.temp }}/trivy-kokoro-tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/trivy-kokoro-cache
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-kokoro-cache
        with:
          image-ref: kokoro-tts:ci
          severity: CRITICAL,HIGH
          vuln-type: os,library
          cache: true
          exit-code: '0'
          timeout: 10m
          scanners: vuln
          cache-dir: ${{ env.TRIVY_CACHE_DIR }}
          format: json
          output: trivy-kokoro.json

      - name: Clear Trivy cache to free space (kokoro)
        run: |
          rm -rf ${{ runner.temp }}/trivy-kokoro-cache || true
          df -h

      - name: Upload Trivy report (kokoro)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-kokoro
          path: trivy-kokoro.json

  aggregate-full:
    if: "${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' }}"
    runs-on: ubuntu-latest
    needs:
      - scan-dashboard
      - scan-interface
      - scan-mesh
      - scan-pipecat
      - scan-kokoro
    permissions:
      contents: read
      issues: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Trivy reports
        uses: actions/download-artifact@v4
        with:
          path: trivy-reports

      - name: Create issues for new vulnerabilities
        env:
          TRIVY_REPORTS: |
            [
              {"image":"nia-dashboard:ci","file":"trivy-dashboard.json"},
              {"image":"nia-interface:ci","file":"trivy-interface.json"},
              {"image":"nia-mesh:ci","file":"trivy-mesh.json"},
              {"image":"pipecat-daily-bot:ci-server","file":"trivy-pipecat.json"},
              {"image":"kokoro-tts:ci","file":"trivy-kokoro.json"}
            ]
        run: |
          node scripts/security/trivy-issue-aggregator.mjs \
            --input-dir trivy-reports \
            --reports "$TRIVY_REPORTS"

  sample-report:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'sample' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Download sample Trivy report
        run: |
          curl -fsSL "https://gist.githubusercontent.com/julianoborba/b1c8803f3e4e0eaa3c806f60652f4d08/raw/export-trivy-json-as-csv.txt" -o sample.txt

      - name: Extract JSON payload
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const lines = fs.readFileSync('sample.txt', 'utf8').split('\n');
          const start = lines.findIndex((line) => line.trim() === '# {');
          const end = lines.findIndex((line, index) => index > start && line.trim() === '# }');
          if (start === -1 || end === -1) {
            throw new Error('Failed to locate JSON block in sample file.');
          }
          const jsonLines = lines.slice(start, end + 1).map((line) => line.replace(/^#\s?/, ''));
          fs.writeFileSync('trivy-sample.json', `${jsonLines.join('\n')}\n`);
          NODE

      - name: Upload sample report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sample
          path: trivy-sample.json

  aggregate-sample:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'sample' }}"
    runs-on: ubuntu-latest
    needs:
      - sample-report
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download sample report
        uses: actions/download-artifact@v4
        with:
          path: trivy-reports

      - name: Dry-run issue aggregation
        env:
          TRIVY_REPORTS: |
            [{"image":"sample-image","file":"trivy-sample.json"}]
        run: |
          node scripts/security/trivy-issue-aggregator.mjs \
            --input-dir trivy-reports \
            --reports "$TRIVY_REPORTS" \
            --dry-run
