name: deploy-interface-stg

on:
  push:
    branches: [staging]
    paths:
      - 'apps/interface/**'
      - '.github/workflows/deploy-web-app.yml'
      - '.github/workflows/deploy-interface-stg.yml'
  workflow_dispatch:

jobs:
  interface:
    uses: ./.github/workflows/deploy-web-app.yml
    with:
      app_name: interface
      dockerfile_path: apps/interface/Dockerfile
      environment: stg
      container_name: web
    permissions:
      id-token: write    # obtain OIDC token
      contents: read
    secrets:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_DAILY_ROOM_URL: ${{ secrets.NEXT_PUBLIC_DAILY_ROOM_URL }}
      NEXT_PUBLIC_BOT_CONTROL_BASE_URL: ${{ secrets.NEXT_PUBLIC_BOT_CONTROL_BASE_URL }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_POSTHOG_PROXY_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_PROXY_HOST }}

      SUBMODULE_PAT: ${{ secrets.NIAXP_PAT }}
