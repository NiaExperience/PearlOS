<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 720px; margin: 0 auto; padding: 2rem 1rem; line-height: 1.6; color: #222; }

        h1, h2, h3 { line-height: 1.2; }
        article { margin-bottom: 3rem; }
        time { color: #888; font-size: 0.9rem; }

</head>
<body>
    {{ block "main" . }}{{ end }}
</body>
</html>
