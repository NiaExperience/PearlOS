<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wonder Canvas Test</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; color: #ddd; font-family: system-ui; display: flex; flex-direction: column; height: 100vh; }
#controls { padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; background: #1a1a1a; border-bottom: 1px solid #333; }
#controls button {
  padding: 8px 14px; border-radius: 8px; border: 1px solid #444; background: #222; color: #ccc;
  cursor: pointer; font-size: 13px; transition: background 0.15s;
}
#controls button:hover { background: #333; }
#canvas-wrap { flex: 1; position: relative; }
iframe { width: 100%; height: 100%; border: none; }
#log { height: 120px; overflow-y: auto; background: #0a0a0a; padding: 8px; font-size: 12px; font-family: monospace; border-top: 1px solid #333; }
.log-entry { padding: 2px 0; border-bottom: 1px solid #1a1a1a; }
.log-interaction { color: #9f9; }
.log-ready { color: #99f; }
</style>
</head>
<body>

<div id="controls">
  <button onclick="testScene1()">🌲 Forest Scene</button>
  <button onclick="testScene2()">❓ Quiz Scene</button>
  <button onclick="testOverlay()">📋 Overlay</button>
  <button onclick="testBackground()">🌌 Background</button>
  <button onclick="testAdd()">➕ Add Content</button>
  <button onclick="testAnimate()">💫 Animate</button>
  <button onclick="testTransition('fade')">Fade</button>
  <button onclick="testTransition('slide-left')">Slide Left</button>
  <button onclick="testTransition('slide-right')">Slide Right</button>
  <button onclick="testTransition('dissolve')">Dissolve</button>
  <button onclick="testTransition('instant')">Instant</button>
  <button onclick="testClear()">🗑 Clear</button>
  <button onclick="testAllAnimations()">🎭 All Animations</button>
  <button onclick="testTypewriter()">⌨️ Typewriter</button>
  <button onclick="testAvatarState('idle')">👤 Idle</button>
  <button onclick="testAvatarState('speaking')">🗣 Speaking</button>
  <button onclick="testAvatarState('thinking')">🤔 Thinking</button>
  <button onclick="testAvatarState('summoning')">⚡ Summoning</button>
  <button onclick="testMobileSafe()">📱 Mobile Safe</button>
</div>

<div id="canvas-wrap">
  <iframe id="canvas" src="wonder-canvas-runtime.html"></iframe>
</div>

<div id="log"></div>

<script>
const iframe = document.getElementById('canvas');
const log = document.getElementById('log');

function send(msg) {
  iframe.contentWindow.postMessage(msg, '*');
  addLog('→ ' + msg.type + (msg.layer ? ` [${msg.layer}]` : ''));
}

function addLog(text, cls = '') {
  const div = document.createElement('div');
  div.className = 'log-entry ' + cls;
  div.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

window.addEventListener('message', e => {
  if (e.data?.type === 'wonder.interaction') {
    addLog(`← interaction: ${e.data.action} (label: "${e.data.label}")`, 'log-interaction');
  } else if (e.data?.type === 'wonder.ready') {
    addLog('← scene ready', 'log-ready');
  } else if (e.data?.type === 'wonder.runtime.ready') {
    addLog('← runtime initialized', 'log-ready');
  }
});

function testScene1() {
  send({
    type: 'wonder.scene', layer: 'main', transition: 'fade',
    html: `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(180deg,#0d1117,#1a2332);color:#e8d5b7;font-family:Georgia,serif;padding:20px;text-align:center">
        <h1 style="font-size:2em;margin-bottom:0.5em" class="wonder-fadeIn">The Enchanted Forest</h1>
        <p style="font-size:1.1em;max-width:500px;line-height:1.6;opacity:0.9" class="wonder-fadeIn">
          You stand at the edge of a moonlit clearing. Two paths diverge before you...
        </p>
        <div style="margin-top:40px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center">
          <button class="wonder-choice wonder-fadeIn" data-action="path_moon">🌙 Follow the moonlight</button>
          <button class="wonder-choice wonder-fadeIn" data-action="path_mushroom">🍄 Enter the mushroom grove</button>
        </div>
      </div>`
  });
}

function testScene2() {
  send({
    type: 'wonder.scene', layer: 'main', transition: 'fade',
    html: `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#1a1a2e;color:white;font-family:system-ui;padding:20px;text-align:center">
        <div style="font-size:0.8em;opacity:0.5;margin-bottom:8px">Question 1 of 5</div>
        <h2 style="font-size:1.5em;margin-bottom:30px" class="wonder-fadeIn">What year did the first iPhone launch?</h2>
        <div style="display:flex;flex-direction:column;gap:12px;width:100%;max-width:400px">
          <button class="wonder-choice wonder-slideUp" data-action="answer_2005" style="width:100%">2005</button>
          <button class="wonder-choice wonder-slideUp" data-action="answer_2007" style="width:100%;animation-delay:0.1s">2007</button>
          <button class="wonder-choice wonder-slideUp" data-action="answer_2008" style="width:100%;animation-delay:0.2s">2008</button>
          <button class="wonder-choice wonder-slideUp" data-action="answer_2010" style="width:100%;animation-delay:0.3s">2010</button>
        </div>
      </div>`
  });
}

function testOverlay() {
  send({
    type: 'wonder.scene', layer: 'overlay',
    html: `
      <div style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);border:1px solid rgba(150,130,255,0.3);border-radius:12px;padding:16px 24px;backdrop-filter:blur(10px)" class="wonder-slideUp">
        <p style="color:#e8e8f0;font-size:14px">💡 This is an overlay notification</p>
        <button class="wonder-choice" data-action="dismiss_overlay" style="margin-top:8px;padding:8px 16px;font-size:13px">Dismiss</button>
      </div>`
  });
}

function testBackground() {
  send({
    type: 'wonder.scene', layer: 'background',
    html: `
      <div style="width:100%;height:100%;background:linear-gradient(135deg,#0a0020,#1a0030,#0a0a2a);position:relative">
        <div class="wonder-particles-fireflies"></div>
      </div>`
  });
}

function testAdd() {
  send({
    type: 'wonder.add', layer: 'main',
    html: `<div style="text-align:center;padding:20px" class="wonder-fadeIn"><p style="color:#9f9;font-size:1.2em">✨ Added content!</p></div>`
  });
}

function testAnimate() {
  send({ type: 'wonder.animate', elementId: 'anim-target', animation: 'shake' });
}

let transToggle = false;
function testTransition(t) {
  transToggle = !transToggle;
  send({
    type: 'wonder.scene', layer: 'main', transition: t,
    html: transToggle ? `
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#1a1a2e;color:white">
        <div style="text-align:center">
          <h1 id="anim-target" style="font-size:2.5em;margin-bottom:16px">🌙 Scene A</h1>
          <p>Transition: ${t}</p>
          <button class="wonder-choice" data-action="next" style="margin-top:24px">Next →</button>
        </div>
      </div>` : `
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#2a1a1a;color:white">
        <div style="text-align:center">
          <h1 id="anim-target" style="font-size:2.5em;margin-bottom:16px">☀️ Scene B</h1>
          <p>Transition: ${t}</p>
          <button class="wonder-choice" data-action="prev" style="margin-top:24px">← Back</button>
        </div>
      </div>`
  });
}

function testClear() {
  send({ type: 'wonder.clear', transition: 'fade' });
}

function testAllAnimations() {
  send({
    type: 'wonder.scene', layer: 'main', transition: 'instant',
    html: `
      <div style="display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:center;min-height:100vh;background:#0a0a0f;padding:20px">
        <div class="wonder-fadeIn" style="padding:16px;background:#1a1a2e;border-radius:8px;text-align:center"><span style="font-size:2em">🌟</span><br>fadeIn</div>
        <div class="wonder-slideUp" style="padding:16px;background:#1a1a2e;border-radius:8px;text-align:center"><span style="font-size:2em">⬆️</span><br>slideUp</div>
        <div class="wonder-bounce" style="padding:16px;background:#1a1a2e;border-radius:8px;text-align:center"><span style="font-size:2em">🏀</span><br>bounce</div>
        <div class="wonder-shake" style="padding:16px;background:#1a1a2e;border-radius:8px;text-align:center"><span style="font-size:2em">📳</span><br>shake</div>
        <div class="wonder-pulse" style="padding:16px;background:#1a1a2e;border-radius:8px;text-align:center"><span style="font-size:2em">💓</span><br>pulse</div>
        <div class="wonder-glow" style="padding:16px;background:#1a1a2e;border-radius:8px;text-align:center"><span style="font-size:2em">✨</span><br>glow</div>
        <div class="wonder-spin" style="padding:16px;background:#1a1a2e;border-radius:8px;text-align:center"><span style="font-size:2em">🌀</span><br>spin</div>
      </div>`
  });
}

function testAvatarState(state) {
  send({ type: 'wonder.avatarState', state });
}

function testMobileSafe() {
  send({
    type: 'wonder.scene', layer: 'main', transition: 'fade',
    html: `
      <div class="wonder-avatar-safe" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#1a1a2e;color:white;padding:20px;text-align:center">
        <h2 class="wonder-fadeIn">Mobile-Safe Layout</h2>
        <p style="opacity:0.7;margin:12px 0">Choices avoid the avatar area on mobile</p>
        <div class="wonder-choices-safe" style="margin-top:30px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
          <button class="wonder-choice" data-action="opt_a">Option A</button>
          <button class="wonder-choice" data-action="opt_b">Option B</button>
        </div>
      </div>`
  });
}

function testTypewriter() {
  send({
    type: 'wonder.scene', layer: 'main', transition: 'fade',
    html: `
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0a0a0f;padding:20px">
        <span class="wonder-typewriter" style="font-size:1.5em;color:#9f9">Once upon a time, in a land far away...</span>
      </div>`
  });
}
</script>
</body>
</html>
