<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PearlOS — Something went wrong</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #0a0a0f; color: #e8e8f0;
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  line-height: 1.6; -webkit-font-smoothing: antialiased;
  display: flex; align-items: center; justify-content: center;
}
.crash-screen {
  text-align: center; padding: 40px 24px; max-width: 480px;
}
.crash-icon { font-size: 64px; margin-bottom: 20px; }
h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.subtitle { font-size: 14px; color: #8888a0; margin-bottom: 28px; }
.error-detail {
  background: #13131a; border: 1px solid rgba(248,113,113,0.3);
  border-radius: 10px; padding: 14px; margin-bottom: 24px;
  font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px;
  color: #f87171; text-align: left; max-height: 120px; overflow-y: auto;
  word-break: break-word;
}
.actions { display: flex; flex-direction: column; gap: 10px; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 20px; border-radius: 10px; font: inherit; font-size: 14px;
  font-weight: 600; cursor: pointer; transition: all 0.2s; text-decoration: none;
  border: none;
}
.btn-primary { background: #9682ff; color: #0a0a0f; }
.btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn-recovery {
  background: rgba(150,130,255,0.1); color: #9682ff;
  border: 1px solid rgba(150,130,255,0.3);
}
.btn-recovery:hover { background: rgba(150,130,255,0.2); }
.btn-secondary {
  background: #13131a; color: #e8e8f0;
  border: 1px solid rgba(150,130,255,0.15);
}
.btn-secondary:hover { border-color: rgba(150,130,255,0.5); }
</style>
</head>
<body>

<div class="crash-screen">
  <div class="crash-icon">💔</div>
  <h1>PearlOS hit a snag</h1>
  <p class="subtitle">Something unexpected happened. Don't worry — your data is safe.</p>

  <div class="error-detail" id="error-detail">
    No error details available. If you were redirected here, check the browser console for more info.
  </div>

  <div class="actions">
    <button class="btn btn-primary" onclick="location.reload()">🔄 Try Again</button>
    <a href="/recovery.html" class="btn btn-recovery">🛠️ Open Recovery Mode</a>
    <a href="/" class="btn btn-secondary">🏠 Go Home</a>
  </div>
</div>

<script>
(function() {
  // Pick up error from URL params or sessionStorage
  const params = new URLSearchParams(location.search);
  const errorMsg = params.get('error') || sessionStorage.getItem('pearlos_crash_error');
  if (errorMsg) {
    document.getElementById('error-detail').textContent = errorMsg;
    sessionStorage.removeItem('pearlos_crash_error');
  }
})();
</script>
</body>
</html>
