<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1440px; height: 900px; overflow: hidden; background: black; }
    .before-label, .after-label {
      position: absolute; top: 16px; z-index: 10;
      background: rgba(0,0,0,0.7); color: white;
      padding: 6px 16px; border-radius: 6px; font: bold 18px sans-serif;
    }
    .before-label { left: 16px; }
    .after-label { left: 760px; }
    .half { position: absolute; top: 0; width: 720px; height: 900px; overflow: hidden; }
    .half.left { left: 0; }
    .half.right { left: 720px; }
    .bg { position: absolute; inset: 0; background-image: url('/backgrounds/desktop-forest.png'); background-size: cover; background-position: center; }
    .bg.brightened { filter: brightness(1.4) saturate(1.2); }
    .divider { position: absolute; left: 720px; top: 0; width: 3px; height: 900px; background: white; z-index: 10; }
    .icons { position: absolute; top: 60px; left: 20px; display: flex; flex-direction: column; gap: 24px; }
    .icon { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
    .icon-box { width: 56px; height: 56px; border-radius: 14px; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 28px; }
    .icon-label { color: white; font: 12px sans-serif; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
  </style>
</head>
<body>
  <!-- Before (dark) -->
  <div class="half left">
    <div class="bg"></div>
    <div class="before-label">BEFORE (near-black)</div>
    <div class="icons">
      <div class="icon"><div class="icon-box">📝</div><div class="icon-label">Notes</div></div>
      <div class="icon"><div class="icon-box">🌐</div><div class="icon-label">Browser</div></div>
      <div class="icon"><div class="icon-box">▶️</div><div class="icon-label">YouTube</div></div>
      <div class="icon"><div class="icon-box">💬</div><div class="icon-label">Discord</div></div>
      <div class="icon"><div class="icon-box">🖩</div><div class="icon-label">Calculator</div></div>
      <div class="icon"><div class="icon-box">💻</div><div class="icon-label">Terminal</div></div>
      <div class="icon"><div class="icon-box">⚙️</div><div class="icon-label">Settings</div></div>
    </div>
  </div>
  <!-- Divider -->
  <div class="divider"></div>
  <!-- After (brightened) -->
  <div class="half right">
    <div class="bg brightened"></div>
    <div class="after-label">AFTER (brightness 1.4, saturate 1.2)</div>
    <div class="icons">
      <div class="icon"><div class="icon-box">📝</div><div class="icon-label">Notes</div></div>
      <div class="icon"><div class="icon-box">🌐</div><div class="icon-label">Browser</div></div>
      <div class="icon"><div class="icon-box">▶️</div><div class="icon-label">YouTube</div></div>
      <div class="icon"><div class="icon-box">💬</div><div class="icon-label">Discord</div></div>
      <div class="icon"><div class="icon-box">🖩</div><div class="icon-label">Calculator</div></div>
      <div class="icon"><div class="icon-box">💻</div><div class="icon-label">Terminal</div></div>
      <div class="icon"><div class="icon-box">⚙️</div><div class="icon-label">Settings</div></div>
    </div>
  </div>
</body>
</html>
