<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Newspaper body -->
  <rect x="6" y="10" width="52" height="44" rx="4" fill="#1e293b"/>
  <rect x="6" y="10" width="52" height="44" rx="4" stroke="#475569" stroke-width="1.5" fill="none"/>
  <!-- Header bar -->
  <rect x="6" y="10" width="52" height="14" rx="4" fill="#2d1b69"/>
  <rect x="6" y="20" width="52" height="4" fill="#2d1b69"/>
  <!-- "The News" text -->
  <text x="32" y="21" font-size="9" fill="#FFD233" font-family="'Georgia','Times New Roman',serif" font-weight="bold" text-anchor="middle" letter-spacing="0.5">The News</text>
  <!-- Divider line -->
  <rect x="10" y="26" width="44" height="1" fill="#475569"/>
  <!-- Globe icon area (top-left article image) -->
  <circle cx="22" cy="36" r="8" fill="#1a3a5f" stroke="#38bdf8" stroke-width="1"/>
  <ellipse cx="22" cy="36" rx="8" ry="3" fill="none" stroke="#38bdf8" stroke-width="0.7"/>
  <line x1="22" y1="28" x2="22" y2="44" stroke="#38bdf8" stroke-width="0.7"/>
  <ellipse cx="22" cy="36" rx="3" ry="8" fill="none" stroke="#38bdf8" stroke-width="0.7"/>
  <!-- Text lines (article content) -->
  <rect x="34" y="30" width="20" height="3" rx="1" fill="#94a3b8"/>
  <rect x="34" y="35" width="18" height="3" rx="1" fill="#64748b"/>
  <rect x="34" y="40" width="16" height="3" rx="1" fill="#475569"/>
  <!-- Bottom article lines -->
  <rect x="10" y="47" width="44" height="2" rx="1" fill="#64748b"/>
  <rect x="10" y="51" width="30" height="2" rx="1" fill="#475569"/>
  <!-- Pink accent dot (live indicator) -->
  <circle cx="52" cy="14" r="2.5" fill="#D94F8E"/>
</svg>